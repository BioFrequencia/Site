name: Site

# Valida o site (Next.js): testes, tipos, lint e build de produção.
# Roda em push de qualquer branch (não só da principal), para uma branch
# de trabalho já ficar validada antes do PR.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes, tipos, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci (e não npm install): respeita o package-lock.json e falha
      # se ele estiver fora de sincronia com o package.json, em vez de
      # resolver versões diferentes das testadas.
      - name: Instalar dependências
        run: npm ci

      # Regras de endereço da API, sessão expirada e datas/fuso
      # (lib/*.test.ts, node --test, sem dependência extra).
      - name: Testes
        run: npm test

      - name: Verificação de tipos
        run: npx tsc --noEmit

      # O script "lint" do projeto é o eslint direto: o `next lint` foi
      # removido no Next 16 e falha com "Invalid project directory".
      - name: Lint
        run: npm run lint

      # Build com um endereço de API de exemplo, como na Vercel. Confere
      # que esse endereço foi embutido no JavaScript do site.
      - name: Build de produção
        env:
          NEXT_PUBLIC_API_URL: https://api-de-teste.example/
        run: |
          npm run build
          grep -rq "api-de-teste.example" .next/static || { echo "::error::NEXT_PUBLIC_API_URL não foi embutida no build"; exit 1; }

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .next/
          retention-days: 7
