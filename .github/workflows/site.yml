name: Site

# Valida o site institucional (Next.js): tipos, lint e build de produção.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    name: Tipos, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci (e não npm install): respeita o package-lock.json e falha
      # se ele estiver fora de sincronia com o package.json, em vez de
      # resolver versões diferentes das testadas.
      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos
        run: npx tsc --noEmit

      # O script "lint" do projeto é o eslint direto: o `next lint` foi
      # removido no Next 16 e falha com "Invalid project directory".
      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .next/
          retention-days: 7
